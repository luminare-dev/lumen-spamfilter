# Expectations for tests/corpus (scripts/corpus_run.py). Every message is synthetic.
#
# expect = "spam": the Rspamd action must be add header (score at least 6, below reject 15)
# expect = "ham":  the action must be no action (score below the greylist score 4)
# dkim:  sign with a key the test DNS publishes for the From domain (default true)
# spf_ip: the sending address; inside 198.51.100.0/24 passes SPF, 203.0.113.0/24 fails
# symbols / not_symbols: rules that must (not) be in the result

[[message]]
file = "spam/pharma-obfuscated-personalised.eml"
expect = "spam"
symbols = ["LUMEN_OBFUSCATED_TERM", "LUMEN_SUBJECT_RCPT_DOMAIN", "LUMEN_BODY_RCPT_DOMAIN_GREETING",
           "LUMEN_PHARMA_STRONG", "LUMEN_FROM_TLD_HIGH"]

[[message]]
file = "spam/pharma-zero-width.eml"
expect = "spam"
symbols = ["LUMEN_ZERO_WIDTH_IN_WORD", "LUMEN_OBFUSCATED_TERM", "LUMEN_PHARMA_STRONG"]

[[message]]
file = "spam/pharma-plain-throwaway.eml"
expect = "spam"
symbols = ["LUMEN_PHARMA_STRONG", "LUMEN_PHARMA_SUBJECT", "LUMEN_SUBJECT_RCPT_DOMAIN", "LUMEN_FROM_TLD_HIGH",
           "LUMEN_AUTH_ON_THROWAWAY", "LUMEN_URL_TLD_HIGH"]
not_symbols = ["LUMEN_OBFUSCATED_TERM"]

[[message]]
file = "spam/pharma-domain-greeting.eml"
rcpt = "user@example.net"
expect = "spam"
symbols = ["LUMEN_SUBJECT_RCPT_DOMAIN", "LUMEN_BODY_RCPT_DOMAIN_GREETING", "LUMEN_OBFUSCATED_TERM"]

