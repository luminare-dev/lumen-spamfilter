# Caller: lint, unit tests and the full-history secret scan on every pull request and push to main,
# plus three project jobs:
#   corpus     the synthetic spam and ham corpus scanned by the official Rspamd image (pinned by
#              digest) with the generated rules; asserts action, score and rules per message;
#   sieve      the generated Sieve scripts run with Pigeonhole's sieve-test (Ubuntu dovecot-sieve);
#   shellcheck every shell script, including the IMAPSieve pipe scripts the generator writes.
# Only GitHub-owned actions and plain shell are used in these jobs.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      test-command: LUMEN_SPAMFILTER_REQUIRE_NODE=1 python3 -m unittest discover -s tests -v
    permissions:
      contents: read

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read

  corpus:
    name: corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the corpus with Rspamd 4.3.0 (image pinned in scripts/corpus_run.py)
        run: python3 -I scripts/corpus_run.py --json corpus-results.json

      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-results
          path: corpus-results.json
          if-no-files-found: ignore
          retention-days: 14

  sieve:
    name: sieve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pigeonhole (sieve-test, sievec)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dovecot-sieve

      - name: Run the generated scripts with sieve-test
        env:
          LUMEN_SPAMFILTER_REQUIRE_SIEVE: "1"
        run: python3 -m unittest tests.test_sieve_integration -v

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck (repository scripts and generated pipe scripts)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rendered"
          python3 -I bin/lumen-spamfilter --config tests/corpus/imapsieve.toml render --out "$out"
          shellcheck --version
          shellcheck install.sh uninstall.sh "$out"/sieve-pipe/*
